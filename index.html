const state = { sheet: 0, sortCol: -1, sortAsc: true, query: "" };

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  DATA.sheets.forEach((sh, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === state.sheet ? " active" : "");
    b.textContent = sh.name;
    b.title = sh.title || sh.name;
    b.onclick = () => { state.sheet = i; state.sortCol = -1; state.query = ""; document.getElementById("search").value = ""; render(); };
    tabs.appendChild(b);
  });
}

function render(){
  const sh = DATA.sheets[state.sheet];
  document.getElementById("sheetTitle").textContent = sh.title || sh.name;
  const view = document.getElementById("view");
  let html = '<div class="tablewrap"><table><thead>';
  if (sh.groupHeader){
    html += "<tr>";
    sh.groupHeader.forEach(g => { html += '<th class="group" colspan="' + g.colspan + '">' + esc(g.text) + "</th>"; });
    html += "</tr>";
  }
  html += "<tr>";
  sh.headers.forEach((h, j) => {
    const arrow = state.sortCol === j ? (state.sortAsc ? " &#9650;" : " &#9660;") : "";
    html += '<th class="col" data-col="' + j + '">' + esc(h) + arrow + "</th>";
  });
  html += "</tr></thead><tbody>";
  const q = state.query.toLowerCase();
  let shown = 0;
  sh.rows.forEach(row => {
    if (row.type === "note"){
      html += '<tr class="note"><td colspan="' + sh.headers.length + '">' + esc(row.text) + "</td></tr>";
      return;
    }
    const text = row.cells.join(" ").toLowerCase();
    if (q && !text.includes(q)) return;
    shown++;
    html += "<tr>";
    row.cells.forEach((c, j) => {
      html += '<td class="' + (j === 0 ? "first" : "") + '">' + esc(c) + "</td>";
    });
    html += "</tr>";
  });
  if (shown === 0 && q) html += '<tr><td colspan="' + sh.headers.length + '" class="empty">Sin resultados para &laquo;' + esc(q) + "&raquo;</td></tr>";
  html += "</tbody></table></div>";
  view.innerHTML = html;
  view.querySelectorAll("th.col").forEach(th => {
    th.onclick = () => {
      const j = +th.dataset.col;
      if (state.sortCol === j) state.sortAsc = !state.sortAsc;
      else { state.sortCol = j; state.sortAsc = true; }
      sortRows(j);
      render();
    };
  });
}

function sortRows(j){
  const sh = DATA.sheets[state.sheet];
  const data = sh.rows.filter(r => r.type === "data");
  const notes = sh.rows.filter(r => r.type === "note");
  data.sort((a, b) => {
    const va = a.cells[j] ?? "", vb = b.cells[j] ?? "";
    const na = parseFloat(String(va).replace(",", ".")), nb = parseFloat(String(vb).replace(",", "."));
    if (!isNaN(na) && !isNaN(nb)) return state.sortAsc ? na - nb : nb - na;
    return state.sortAsc ? String(va).localeCompare(String(vb), "es") : String(vb).localeCompare(String(va), "es");
  });
  sh.rows = data.concat(notes);
}

function csvCell(v){
  const s = String(v ?? "");
  return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(){
  const sh = DATA.sheets[state.sheet];
  const lines = [sh.headers.map(csvCell).join(",")];
  sh.rows.filter(r => r.type === "data").forEach(r => lines.push(r.cells.map(csvCell).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = sh.name.replace(/[^\w]+/g, "_") + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; render(); });
document.getElementById("export").addEventListener("click", exportCSV);
renderTabs();
render();
</script>
